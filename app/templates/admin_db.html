{% extends "base.html" %}
{% block title %}БД — таблицы{% endblock %}
{% block content %}
<h1>База данных (read-only)</h1>
<table class="grid">
  <thead><tr><th>Таблица</th><th>Столбцов</th></tr></thead>
  <tbody>
  {% for name, ncols in tables %}
    <tr><td><a href="/admin/db/{{ name }}">{{ name }}</a></td><td>{{ ncols }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
